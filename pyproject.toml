[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-command-center"
version = "0.1.0"
description = "Research Data Command Center foundation scaffold"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "duckdb>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["shared", "sdk", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared", "sdk", "backend"]

[tool.ruff]
line-length = 100
target-version = "py313"
